[tool.ruff]
target-version = "py310"
line-length = 100
include = ["formalization/*.py", "checks/*.py", "tools/*.py"]
extend-exclude = [
  "formalization/.lake",
  # The finite checks are kept in their original compact style.
  "checks/research_checks.py",
  "checks/atom_access.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
